[package]
name = "tiletrail"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
description = "Detect and track video feeds in burned-in multiviews and meeting recordings"
license = "MIT"
exclude = [
    "**/__pycache__/",
    "validation/**/media/",
    "validation/real/output/",
    "benchmarks/output/",
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
pathfinding = "=4.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "24", default-features = false, features = ["metal", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
